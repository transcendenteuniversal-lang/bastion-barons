# Testes EditMode + build Android com GameCI.
# Requer os secrets UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD (ver docs/BUILD.md).
# Disparo manual para não falhar enquanto a licença não estiver configurada.
name: Unity CI
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Gerar APK de teste"
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
  android:
    needs: test
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: BastionBarons.EditorTools.BuildScript.BuildApkCli
      - uses: actions/upload-artifact@v4
        with:
          name: BastionBarons-apk
          path: Builds/Android
