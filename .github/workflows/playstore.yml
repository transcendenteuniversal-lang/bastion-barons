# Gera o Android App Bundle (AAB) assinado com a chave de upload, para enviar à Google Play.
# Rode manualmente em Actions → Play Store → Run workflow. O AAB fica nos artefatos da execução.
name: Play Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes das regras do jogo
        run: node tools/sim-test.js

      - name: Android SDK 36 e bundletool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O "$RUNNER_TEMP/bundletool.jar"

      - name: Gerar AAB
        env:
          BUNDLETOOL: ${{ runner.temp }}/bundletool.jar
          UPLOAD_KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KS_PASS: ${{ secrets.UPLOAD_KS_PASS }}
        run: |
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          if [ -n "$UPLOAD_KS_B64" ]; then
            echo "$UPLOAD_KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          ./tools/build-aab.sh

      - name: Validar o bundle
        run: |
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=release/BastionBarons.aab | head -5
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=release/BastionBarons.aab | grep -E "versionCode|uses-sdk|targetSdk|property" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BastionBarons-aab
          path: release/BastionBarons.aab

      # também num Release de pré-lançamento (o atualizador do APK ignora, pois não é o "latest")
      - name: Release play-store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view play-store > /dev/null 2>&1; then
            gh release upload play-store release/BastionBarons.aab --clobber
          else
            gh release create play-store release/BastionBarons.aab --prerelease --latest=false \
              --title "Google Play (AAB)" --notes "Android App Bundle para a Google Play. Assine com a chave de upload antes de enviar, se ainda não estiver assinado."
          fi
